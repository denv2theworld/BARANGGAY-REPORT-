<!DOCTYPE html>
<html>
  <head>
    <title>Admin Portal - Reports</title>
    <link rel="stylesheet" href="styles1.css">
  </head>
  <body>
    <h1>Admin Portal</h1>
    <h3>Barangay 123</h3>

    <div class="stats-container">
      <div class="stat-box pending">
        <h2 id="pendingCount">0</h2>
        <p>Pending</p>
      </div>
      <div class="stat-box processing">
        <h2 id="processingCount">0</h2>
        <p>Processing</p>
      </div>
      <div class="stat-box finished">
        <h2 id="finishedCount">0</h2>
        <p>Finished</p>
      </div>
    </div>

    <div id="reportsList" class="reports-list"></div>

    <script src="script1.js"></script>
  </body>
</html>
